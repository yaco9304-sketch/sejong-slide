<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">PPT Master · 자료 미리보기</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header id="workspace-header">
        <div class="workspace-brand">
            <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span class="brand-name">PPT Master</span>
            <span class="header-divider"></span>
            <span data-i18n="workspace_title">자료 미리보기</span>
        </div>
        <div class="workspace-actions">
            <div id="pending-status" class="pending-status" role="status" aria-live="polite"></div>
            <div class="lang-select">
                <button id="btn-lang-toggle" class="lang-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="lang-current"></span><span class="lang-caret" aria-hidden="true">⌄</span></button>
                <ul id="lang-menu" class="lang-menu" role="listbox" hidden>
                    <li role="option" tabindex="0" aria-selected="false" data-lang="zh">中文</li>
                    <li role="option" tabindex="0" aria-selected="false" data-lang="en">English</li>
                    <li role="option" tabindex="0" aria-selected="false" data-lang="ja">日本語</li>
                    <li role="option" tabindex="0" aria-selected="false" data-lang="ko">한국어</li>
                </ul>
            </div>
            <button id="btn-save" type="button" data-i18n="btn_submit_annotations">변경 적용</button>
            <button id="btn-exit-preview" type="button" data-i18n="btn_exit_preview">닫기</button>
        </div>
    </header>
    <main id="app">
        <aside id="panel-left" aria-label="Slides">
            <div class="panel-header"><span data-i18n="panel_slides">슬라이드</span><span id="slide-count">0</span></div>
            <div id="slide-list"></div>
        </aside>
        <section id="panel-center" aria-label="Slide canvas">
            <div id="canvas-toolbar">
                <span id="nav-name"></span>
                <button id="btn-toggle-inspector" class="quiet-button" type="button" aria-controls="panel-right" aria-expanded="true">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M12 3v14"/></svg>
                    <span data-i18n="toggle_inspector">수정 도구</span>
                </button>
            </div>
            <div id="svg-container">
                <div id="rubber-band-overlay"></div>
                <div id="svg-placeholder" data-i18n="placeholder_select_slide">슬라이드를 준비하고 있어요.</div>
                <div id="svg-content" style="display:none;"></div>
            </div>
            <footer id="stage-footer">
                <span class="canvas-hint" data-i18n="canvas_hint">글자나 그림을 눌러 수정할 수 있어요.</span>
                <nav id="slide-nav" aria-label="Slide navigation">
                    <button id="nav-first" class="nav-btn" type="button" data-i18n-title="nav_first"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5v10M14 5l-5 5 5 5"/></svg></button>
                    <button id="nav-prev" class="nav-btn" type="button" data-i18n-title="nav_prev"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5l-5 5 5 5"/></svg></button>
                    <span id="nav-counter">— / —</span>
                    <button id="nav-next" class="nav-btn" type="button" data-i18n-title="nav_next"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5l5 5-5 5"/></svg></button>
                    <button id="nav-last" class="nav-btn" type="button" data-i18n-title="nav_last"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 5v10M6 5l5 5-5 5"/></svg></button>
                </nav>
                <button id="btn-undo" class="btn-undo" type="button" data-i18n="btn_undo" disabled>되돌리기</button>
            </footer>
        </section>
        <aside id="panel-right" aria-label="Editing tools">
            <div class="panel-header">
                <span data-i18n="panel_edit_annotate">수정하기</span>
                <button id="btn-close-inspector" class="quiet-button" type="button" data-i18n-title="close_inspector">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
                </button>
            </div>
            <div class="inspector-content">
                <div id="selection-info">
                    <div class="section-label" data-i18n="label_selected_element">선택한 항목</div>
                    <div id="selected-element" class="empty" data-i18n="empty_selected_element">고칠 글자나 그림을 슬라이드에서 골라주세요.</div>
                </div>
                <div id="annotation-input" style="display:none;">
                    <label class="section-label" for="annotation-text" data-i18n="label_edit_instruction">어떻게 바꿀까요?</label>
                    <div id="annotation-quick-actions"></div>
                    <textarea id="annotation-text" data-i18n-placeholder="placeholder_annotation"></textarea>
                    <button id="btn-add-annotation" type="button" data-i18n="btn_add_annotation">수정 요청 추가</button>
                </div>
                <details id="object-inspector" style="display:none;">
                    <summary data-i18n="inspector_details">직접 수정</summary>
                    <div id="element-props" style="display:none;"></div>
                </details>
                <div id="annotation-list">
                    <div class="section-label" data-i18n="label_annotations_on_slide">이 슬라이드의 수정 요청</div>
                    <div id="annotations"></div>
                </div>
            </div>
            <div id="preview-actions"><p data-i18n="apply_hint">수정 요청을 적용한 뒤, 대화에서 반영을 요청해주세요.</p></div>
        </aside>
    </main>
    <div id="modal-overlay" style="display:none;">
        <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-message">
            <div id="modal-message"></div>
            <div id="modal-buttons">
                <button id="modal-cancel" type="button" data-i18n="modal_cancel">취소</button>
                <button id="modal-confirm" type="button" data-i18n="modal_submit">적용</button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
