<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sejong-slide</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header id="workspace-header">
        <div class="workspace-brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <strong>sejong-slide</strong><span class="header-divider"></span><span data-i18n="new_material">새 자료</span>
        </div>
        <div class="lang-select">
            <button id="btn-lang-toggle" class="lang-select-btn" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="lang-current"></span><span class="lang-caret" aria-hidden="true">⌄</span></button>
            <ul id="lang-menu" class="lang-menu" role="listbox" hidden>
                <li role="option" tabindex="0" aria-selected="false" data-lang="zh">中文</li>
                <li role="option" tabindex="0" aria-selected="false" data-lang="en">English</li>
                <li role="option" tabindex="0" aria-selected="false" data-lang="ja">日本語</li>
                <li role="option" tabindex="0" aria-selected="false" data-lang="ko">한국어</li>
            </ul>
        </div>
    </header>
    <main id="app">
        <aside id="preview-panel" aria-label="Design preview">
            <div id="topbar-preview"></div>
        </aside>
        <section id="control-panel">
            <header id="topbar"><div id="topbar-inner"><div class="topbar-titles">
                <h1 data-i18n="page_title">자료의 방향</h1>
                <p id="topbar-hint" data-i18n="topbar_hint">필요한 것만 정하고 제작을 시작하세요.</p>
            </div></div></header>
            <div id="form">
                <div id="loading" data-i18n="loading">추천안을 불러오는 중…</div>
                <div id="error" style="display:none;" role="alert"></div>
                <div id="sections" style="display:none;"></div>
            </div>
            <footer id="actionbar" style="display:none;">
                <span id="confirm-status" role="status" aria-live="polite"></span>
                <button id="btn-confirm" type="button" data-i18n="btn_confirm">이대로 제작하기</button>
            </footer>
        </section>
    </main>
    <div id="confirmed-overlay" style="display:none;">
        <div class="cf-card" role="status">
            <div class="cf-title" data-i18n="confirmed_title">제작 방향을 저장했어요.</div>
            <div class="cf-hint" data-i18n="confirmed_hint">대화로 돌아가면 제작을 이어갈 수 있어요.</div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
